[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zroad"
version = "0.8.1"
description = "末路求生：末世公路题材纯文字单机游戏（规则框架灵感来源于桌游 Hit Z Road）；可移植规则核心 + 多前端"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
zroad = "zroad.platforms.desktop_rich.app:main"

[project.optional-dependencies]
desktop = ["rich>=13.0"]
dev = ["pytest>=8.0", "rich>=13.0"]

[tool.setuptools.packages.find]
where = ["src"]

# 数据 JSON 随包安装（pipx/pip 安装与 PyInstaller 打包后仍可读取）
[tool.setuptools.package-data]
zroad = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
