[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zroad"
version = "0.7.0"
description = "亡命之途（Hit Z Road）纯文字版：可移植规则核心 + 多前端"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
zroad = "zroad.platforms.desktop_rich.app:main"

[project.optional-dependencies]
desktop = ["rich>=13.0"]
dev = ["pytest>=8.0", "rich>=13.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
