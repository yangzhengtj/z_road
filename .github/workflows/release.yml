name: release

# 推送 v 开头的 tag（如 v0.7.1）时，在四个平台环境各构建一个单文件可执行，
# 并汇总发布到 GitHub Release。PyInstaller 不能交叉编译，所以用矩阵各建各的。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: 构建 ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux-x86_64
            ext: ""
          - os: windows-latest
            label: windows-x86_64
            ext: ".exe"
          - os: macos-14          # Apple Silicon（M 系列芯片）
            label: macos-arm64
            ext: ""
          - os: macos-13          # Intel 芯片
            label: macos-x86_64
            ext: ""
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装打包依赖
        run: python -m pip install --upgrade pip -r packaging/requirements-build.txt

      - name: PyInstaller 打包（单文件）
        run: pyinstaller packaging/zroad.spec --noconfirm --clean

      - name: 按平台重命名产物
        shell: bash
        run: |
          set -e
          TAG="${GITHUB_REF_NAME:-dev}"
          SRC="dist/zroad${{ matrix.ext }}"
          DST="dist/zroad-${TAG}-${{ matrix.label }}${{ matrix.ext }}"
          mv "$SRC" "$DST"
          chmod +x "$DST" || true
          ls -lh dist

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: zroad-${{ matrix.label }}
          path: dist/zroad-*

  release:
    name: 汇总并发布 Release
    # 只有 tag 推送才发 Release；手动 workflow_dispatch 仅验证构建产物
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载全部平台产物
        uses: actions/download-artifact@v4
        with:
          pattern: zroad-*
          path: dist
          merge-multiple: true

      - name: 列出待发布文件
        run: ls -lh dist

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 亡命之途·文字版 ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/zroad-*
